<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Now Playing</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --line: #252935;
      --text: #eef0f4;
      --muted: #8a90a0;
      --accent: #e8b04b;
      --track: #2c303b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(1200px 600px at 50% -10%, #242833 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* stop text selection / long-press save menus */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .player {
      width: min(400px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 26px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      text-align: center;
    }
    .disc {
      width: 68%;
      aspect-ratio: 1;
      margin: 4px auto 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle, var(--card) 0 11%, rgba(255,255,255,.08) 11% 12.5%, transparent 12.5%),
        repeating-radial-gradient(circle, rgba(0,0,0,.18) 0 2px, transparent 2px 5px),
        conic-gradient(from 200deg, #e8b04b, #c2552f, #5b3a8c, #2d6a8a, #e8b04b);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .5);
      animation: spin 9s linear infinite;
      animation-play-state: paused;
    }
    .disc.playing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 1.25rem; margin: 0 0 4px; font-weight: 650; }
    .artist { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      margin: 0;
      border-radius: 3px;
      background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--track) var(--p, 0%));
      cursor: pointer;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text); border: none;
    }
    input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text); border: none;
    }
    input[type=range]:disabled { cursor: default; opacity: .5; }

    .times {
      display: flex; justify-content: space-between;
      margin: 8px 0 18px;
      font-size: .8rem; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .controls { display: flex; align-items: center; justify-content: center; gap: 22px; }
    button {
      border: none; background: none; color: var(--text);
      cursor: pointer; display: grid; place-items: center; padding: 0;
    }
    button:disabled { opacity: .4; cursor: default; }
    .skip { width: 44px; height: 44px; border-radius: 50%; color: var(--muted); }
    .skip:hover:not(:disabled) { color: var(--text); }
    .play {
      width: 66px; height: 66px; border-radius: 50%;
      background: var(--accent); color: #1a1408;
      box-shadow: 0 8px 22px rgba(232, 176, 75, .3);
      transition: transform .12s ease;
    }
    .play:active:not(:disabled) { transform: scale(.94); }
    .play svg, .skip svg { width: 26px; height: 26px; }
    .play .icon-pause { display: none; }
    .play.is-playing .icon-play { display: none; }
    .play.is-playing .icon-pause { display: block; }

    .volume {
      display: flex; align-items: center; gap: 10px;
      margin-top: 22px; color: var(--muted);
    }
    .volume svg { width: 18px; height: 18px; flex: none; }
    .status { min-height: 1.2em; margin: 14px 0 0; font-size: .82rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="player" aria-label="Audio player">
    <div class="disc" id="disc" aria-hidden="true"></div>

    <h1 id="title">Loading…</h1>
    <p class="artist" id="artist"></p>

    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
    <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>

    <div class="controls">
      <button class="skip" id="back" aria-label="Back 10 seconds" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui">10</text></svg>
      </button>
      <button class="play" id="play" aria-label="Play" disabled>
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="skip" id="fwd" aria-label="Forward 10 seconds" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui">10</text></svg>
      </button>
    </div>

    <div class="volume">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="range" id="volume" min="0" max="100" value="100" aria-label="Volume">
    </div>

    <p class="status" id="status">Loading audio…</p>
  </main>

  <script src="player.js"></script>
</body>
</html>
